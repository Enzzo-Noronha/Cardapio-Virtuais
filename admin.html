<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração do Cardápio</title><style>
:root{--p:#79215d;--d:#28132a;--bg:#fff7ee;--line:#eadde6;--mut:#746677}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:var(--d)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(120deg,var(--d),var(--p));color:#fff;padding:18px max(17px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:22px 17px}.box,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.login{max-width:430px;margin:8vh auto}.field{display:grid;gap:5px;margin:11px 0}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:8px}.primary,.outline,.danger,.tab{border:0;border-radius:8px;padding:9px 12px;font-weight:700}.primary{background:var(--p);color:white}.outline,.tab{background:white;border:1px solid var(--line)}.danger{background:#bd3040;color:#fff}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.tab.active{background:var(--p);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.metric{font-size:27px;color:var(--p);font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:var(--mut)}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.modal{position:fixed;inset:0;background:#1d0d2088;display:grid;place-items:center;padding:15px}.modal .box{width:min(560px,100%);max-height:90vh;overflow:auto}.hidden{display:none!important}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:none;border:0;font-size:26px}.notice{background:#fff3ca;padding:10px;border-radius:8px}.error{color:#b21e30;min-height:18px}@media(max-width:580px){.top{padding:14px}.row{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}
</style><body><header class="top"><b>Administração do Cardápio</b><button class="outline hidden" id="logout">Sair</button></header><main class="wrap"><section id="loginBox" class="box login"><h1>Entrar</h1><p>Acesso exclusivo da proprietária.</p><p id="loginError" class="error"></p><label class="field">Usuário<input id="username" autocomplete="username" autocapitalize="none" placeholder="Ex.: Thaisa"></label><label class="field">Senha<input id="password" type="password" autocomplete="current-password"></label><button class="primary" style="width:100%" id="login">Entrar</button></section><section id="app" class="hidden"><div class="head"><div><h1 id="storeName">Minha loja</h1><p id="storeStatus"></p></div><button class="primary" id="saveStore">Salvar loja</button></div><nav id="tabs" class="tabs"></nav><section id="view"></section></section></main><section id="modal" class="modal hidden"><div class="box"><div class="head"><h2 id="modalTitle"></h2><button class="close" onclick="hideModal()">×</button></div><div id="modalBody"></div></div></section>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// Esta é a chave pública do projeto. Chaves secret/service_role nunca devem estar em arquivos HTML.
const SUPABASE_URL='https://tsjrqzflmozevuzathrr.supabase.co',SUPABASE_ANON_KEY='sb_publishable_sODqRL6ff2pDNAj-oU_32g__upCu610',USERNAME_DOMAIN='login.imperiodoacai.com';const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let business,tab='Resumo',cache={};
window.hideModal=()=>$('modal').classList.add('hidden');function error(e){console.error(e);alert('Ocorreu um erro. Veja o console e confira as permissões/configuração.')}async function init(){let {data:{user}}=await sb.auth.getUser();if(!user)return;$('loginBox').classList.add('hidden');$('logout').classList.remove('hidden');let {data:membership,error:e}=await sb.from('store_admins').select('business_id').eq('user_id',user.id).single();if(e){$('loginError').textContent='Este usuário não está vinculado a uma loja como administrador.';return}let r=await sb.from('businesses').select('*').eq('id',membership.business_id).single();if(r.error)return error(r.error);business=r.data;$('app').classList.remove('hidden');$('storeName').textContent=business.name;$('storeStatus').textContent=business.is_open?'Cardápio aberto':'Cardápio fechado';renderTabs();loadTab()}function renderTabs(){let t=['Resumo','Produtos','Complementos','Localidades','Pagamento','Loja','Pedidos'];$('tabs').innerHTML=t.map(x=>`<button class="tab ${x===tab?'active':''}" onclick="window.changeTab('${x}')">${x}</button>`).join('')}window.changeTab=x=>{tab=x;renderTabs();loadTab()};
async function loadTab(){let v=$('view');$('saveStore').classList.toggle('hidden',tab!=='Loja');v.innerHTML='<p>Carregando…</p>';try{if(tab==='Resumo'){let {data:o,error:e}=await sb.from('orders').select('total,created_at').eq('business_id',business.id);if(e)throw e;let today=new Date().toDateString(),d=(o||[]).filter(x=>new Date(x.created_at).toDateString()===today),resetAt=business.revenue_reset_at?new Date(business.revenue_reset_at):null,revenue=resetAt?d.filter(x=>new Date(x.created_at)>=resetAt):d,resetText=resetAt?'Zerado às '+resetAt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Inclui os pedidos de hoje.';v.innerHTML=`<div class="grid"><article class="card">Pedidos recebidos <div class="metric">${o?.length||0}</div></article><article class="card">Pedidos hoje <div class="metric">${d.length}</div></article><article class="card">Faturamento hoje <div class="metric">${money(revenue.reduce((s,x)=>s+Number(x.total),0))}</div><small>${resetText}</small><br><button class="outline" style="margin-top:9px" onclick="window.resetRevenue()">Zerar faturamento</button></article><article class="card">Status <div class="metric">${business.is_open?'Aberto':'Fechado'}</div></article></div>`}else if(tab==='Produtos'){let [p,c]=await Promise.all([sb.from('products').select('*,categories(name)').eq('business_id',business.id).order('name'),sb.from('categories').select('*').eq('business_id',business.id).order('position')]);cache.categories=c.data||[];listProducts(p.data||[])}else if(tab==='Complementos')list(await get('complements'),'complemento');else if(tab==='Localidades')list(await get('localities'),'localidade');else if(tab==='Pagamento')payments(await get('payment_methods'));else if(tab==='Loja')storeForm();else orders(await get('orders'));}catch(e){error(e)}}async function get(table){let sort=table==='orders'?'created_at':table==='payment_methods'?'method':'name',query=sb.from(table).select('*').eq('business_id',business.id).order(sort,{ascending:table!=='orders'});let {data,error:e}=await query;if(e)throw e;return data}window.resetRevenue=async()=>{if(!confirm('Zerar apenas o faturamento exibido? Os pedidos continuarão salvos.'))return;let r=await sb.from('businesses').update({revenue_reset_at:new Date().toISOString()}).eq('id',business.id).select().single();if(r.error)return error(r.error);business=r.data;alert('Faturamento zerado. Os pedidos foram preservados.');loadTab()}
function listProducts(rows){$('view').innerHTML=`<div class="head"><h2>Produtos</h2><span><button class="outline" onclick="window.categoryForm()">Categorias</button> <button class="primary" onclick="window.productForm()">Adicionar produto</button></span></div>${rows.map(x=>`<div class="row"><span><b>${x.name}</b><small>${x.categories?.name||'Sem categoria'} · ${money(x.price)} · ${x.included_complements||0} complemento(s) incluso(s)${x.includes_coverage?' + cobertura':''} · ${x.active?'Ativo':'Inativo'}</small></span><span class="actions"><button class="outline" onclick="window.productForm('${x.id}')">Editar</button><button class="danger" onclick="window.remove('products','${x.id}')">Remover</button></span></div>`).join('')||'<p class="notice">Nenhum produto cadastrado.</p>'}`}
function list(rows,type){$('view').innerHTML=`<div class="head"><h2>${type==='complemento'?'Complementos':'Localidades'}</h2><button class="primary" onclick="window.simpleForm('${type}')">Adicionar</button></div>${rows.map(x=>`<div class="row"><span><b>${x.name}</b><small>${type==='complemento'?money(x.price)+' · '+(x.kind==='cobertura'?'Cobertura':'Complemento'):'Entrega: '+money(x.fee)} · ${x.active?'Ativo':'Inativo'}</small></span><span class="actions"><button class="outline" onclick="window.simpleForm('${type}','${x.id}')">Editar</button><button class="danger" onclick="window.remove('${type==='complemento'?'complements':'localities'}','${x.id}')">Remover</button></span></div>`).join('')||'<p class="notice">Nenhum item cadastrado.</p>'}`}
function payments(rows){$('view').innerHTML='<h2>Formas de pagamento</h2>'+['pix','cash','delivery'].map(m=>{let r=rows.find(x=>x.method===m);return `<div class="row"><b>${m==='pix'?'PIX':m==='cash'?'Dinheiro':'Pagamento na entrega'}</b><label><input type="checkbox" ${r?.active?'checked':''} onchange="window.setPayment('${m}',this.checked)"> Ativo</label></div>`}).join('')}
function storeForm(){$('view').innerHTML=`<h2>Dados da loja</h2><label class="field">Nome<input id="fName" value="${business.name}"></label><label class="field">Contato<input id="fContact" value="${business.contact||''}"></label><label class="field">WhatsApp com DDI e DDD<input id="fWhatsapp" value="${business.whatsapp}"></label><label class="field">Chave PIX<input id="fPix" value="${business.pix_key||''}"></label><label class="field">Horário<input id="fHours" value="${business.opening_hours||''}"></label><label><input id="fOpen" type="checkbox" ${business.is_open?'checked':''}> Cardápio aberto</label>`}
function orders(rows){$('view').innerHTML='<h2>Pedidos</h2>'+(rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(o=>`<div class="row"><span><b>${money(o.total)} — ${o.status}</b><small>${new Date(o.created_at).toLocaleString('pt-BR')} · ${o.customer_name||'Cliente'} · ${o.locality_name}</small></span><select onchange="window.setStatus('${o.id}',this.value)">${['novo','em_preparo','saiu_para_entrega','concluido','cancelado'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="notice">Ainda não há pedidos.</p>')}
window.productForm=async id=>{let row=id?(await sb.from('products').select('*').eq('id',id).single()).data:{name:'',description:'',price:'',image_url:'',category_id:'',included_complements:0,includes_coverage:false,active:true};$('modalTitle').textContent=id?'Editar produto':'Novo produto';$('modalBody').innerHTML=`<label class="field">Nome<input id="xName" value="${row.name||''}"></label><label class="field">Categoria<select id="xCategory"><option value="">Selecione</option>${cache.categories.map(c=>`<option value="${c.id}" ${c.id===row.category_id?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="field">Descrição<textarea id="xDescription">${row.description||''}</textarea></label><label class="field">Preço<input id="xPrice" type="number" min="0" step="0.01" value="${row.price||''}"></label><label class="field">Complementos incluídos<input id="xIncluded" type="number" min="0" step="1" value="${row.included_complements||0}"></label><label class="field">URL da imagem<input id="xImage" value="${row.image_url||''}"></label><label><input id="xCoverage" type="checkbox" ${row.includes_coverage?'checked':''}> Permite escolher cobertura</label><br><label><input id="xActive" type="checkbox" ${row.active?'checked':''}> Ativo</label><button class="primary" style="margin-top:12px" onclick="window.saveProduct('${id||''}')">Salvar</button>`;$('modal').classList.remove('hidden')};window.saveProduct=async id=>{let x={business_id:business.id,name:$('xName').value.trim(),category_id:$('xCategory').value||null,description:$('xDescription').value.trim()||null,price:+$('xPrice').value,image_url:$('xImage').value.trim()||null,included_complements:+$('xIncluded').value||0,includes_coverage:$('xCoverage').checked,active:$('xActive').checked};let r=id?await sb.from('products').update(x).eq('id',id):await sb.from('products').insert(x);if(r.error)return error(r.error);hideModal();loadTab()};window.simpleForm=async(type,id)=>{let table=type==='complemento'?'complements':'localities',row=id?(await sb.from(table).select('*').eq('id',id).single()).data:{name:'',kind:'complemento',active:true};$('modalTitle').textContent=id?'Editar':'Novo '+type;$('modalBody').innerHTML=`<label class="field">Nome<input id="xName" value="${row.name||''}"></label><label class="field">${type==='complemento'?'Preço':'Taxa de entrega'}<input id="xValue" type="number" min="0" step="0.01" value="${row.price??row.fee??''}"></label>${type==='complemento'?`<label class="field">Tipo<select id="xKind"><option value="complemento" ${row.kind==='complemento'?'selected':''}>Complemento</option><option value="cobertura" ${row.kind==='cobertura'?'selected':''}>Cobertura</option></select></label>`:''}<label><input id="xActive" type="checkbox" ${row.active?'checked':''}> Ativo</label><button class="primary" style="margin-top:12px" onclick="window.saveSimple('${table}','${id||''}')">Salvar</button>`;$('modal').classList.remove('hidden')};window.saveSimple=async(table,id)=>{let x={business_id:business.id,name:$('xName').value.trim(),active:$('xActive').checked};x[table==='complements'?'price':'fee']=+$('xValue').value;if(table==='complements')x.kind=$('xKind').value;let r=id?await sb.from(table).update(x).eq('id',id):await sb.from(table).insert(x);if(r.error)return error(r.error);hideModal();loadTab()};window.categoryForm=async()=>{let rows=cache.categories;$('modalTitle').textContent='Categorias';$('modalBody').innerHTML=rows.map(c=>`<div class="row"><b>${c.name}</b><button class="danger" onclick="window.remove('categories','${c.id}');hideModal()">Remover</button></div>`).join('')+`<label class="field">Nova categoria<input id="newCategory"></label><button class="primary" onclick="window.addCategory()">Adicionar</button>`;$('modal').classList.remove('hidden')};window.addCategory=async()=>{let r=await sb.from('categories').insert({business_id:business.id,name:$('newCategory').value.trim(),position:cache.categories.length});if(r.error)return error(r.error);hideModal();loadTab()};window.remove=async(table,id)=>{if(!confirm('Remover este item?'))return;let r=await sb.from(table).delete().eq('id',id);if(r.error)return error(r.error);loadTab()};window.setPayment=async(method,active)=>{let {data:r}=await sb.from('payment_methods').select('id').eq('business_id',business.id).eq('method',method).maybeSingle(),q=r?sb.from('payment_methods').update({active}).eq('id',r.id):sb.from('payment_methods').insert({business_id:business.id,method,active}),out=await q;if(out.error)error(out.error)};window.setStatus=async(id,status)=>{let r=await sb.from('orders').update({status}).eq('id',id);if(r.error)error(r.error)};$('saveStore').onclick=async()=>{let x={name:$('fName').value.trim(),contact:$('fContact').value.trim()||null,whatsapp:$('fWhatsapp').value.trim(),pix_key:$('fPix').value.trim()||null,opening_hours:$('fHours').value.trim()||null,is_open:$('fOpen').checked},r=await sb.from('businesses').update(x).eq('id',business.id).select().single();if(r.error)return error(r.error);business=r.data;$('storeName').textContent=business.name;$('storeStatus').textContent=business.is_open?'Cardápio aberto':'Cardápio fechado';alert('Alterações salvas.')};function emailFromUsername(username){let value=username.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');return value?value+'@'+USERNAME_DOMAIN:null}$('login').onclick=async()=>{let email=emailFromUsername($('username').value);if(!email){$('loginError').textContent='Informe o nome de usuário.';return}let {error:e}=await sb.auth.signInWithPassword({email,password:$('password').value});if(e){$('loginError').textContent='Usuário ou senha incorretos.';return}init()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};init();
</script>
