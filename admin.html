<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração do Cardápio</title><style>
:root{--p:#79215d;--d:#28132a;--bg:#fff7ee;--line:#eadde6;--mut:#746677}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:var(--d)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(120deg,var(--d),var(--p));color:#fff;padding:18px max(17px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:22px 17px}.box,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.login{max-width:430px;margin:8vh auto}.field{display:grid;gap:5px;margin:11px 0}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:8px}.primary,.outline,.danger,.tab{border:0;border-radius:8px;padding:9px 12px;font-weight:700}.primary{background:var(--p);color:white}.outline,.tab{background:white;border:1px solid var(--line)}.danger{background:#bd3040;color:#fff}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.tab.active{background:var(--p);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.metric{font-size:27px;color:var(--p);font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:var(--mut)}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.modal{position:fixed;inset:0;background:#1d0d2088;display:grid;place-items:center;padding:15px}.modal .box{width:min(560px,100%);max-height:90vh;overflow:auto}.hidden{display:none!important}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:none;border:0;font-size:26px}.notice{background:#fff3ca;padding:10px;border-radius:8px}.error{color:#b21e30;min-height:18px}@media(max-width:580px){.top{padding:14px}.row{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}
</style><body><header class="top"><b>Administração do Cardápio</b><button class="outline hidden" id="logout">Sair</button></header><main class="wrap"><section id="loginBox" class="box login"><h1>Entrar</h1><p>Acesso exclusivo da proprietária.</p><p id="loginError" class="error"></p><label class="field">Usuário<input id="username" autocomplete="username" autocapitalize="none" placeholder="Ex.: Thaisa"></label><label class="field">Senha<input id="password" type="password" autocomplete="current-password"></label><button class="primary" style="width:100%" id="login">Entrar</button></section><section id="app" class="hidden"><div class="head"><div><h1 id="storeName">Minha loja</h1><p id="storeStatus"></p></div><button class="primary" id="saveStore">Salvar loja</button></div><nav id="tabs" class="tabs"></nav><section id="view"></section></section></main><section id="modal" class="modal hidden"><div class="box"><div class="head"><h2 id="modalTitle"></h2><button class="close" onclick="hideModal()">×</button></div><div id="modalBody"></div></div></section>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// Esta é a chave pública do projeto. Chaves secret/service_role nunca devem estar em arquivos HTML.
const SUPABASE_URL='https://tsjrqzflmozevuzathrr.supabase.co',SUPABASE_ANON_KEY='sb_publishable_sODqRL6ff2pDNAj-oU_32g__upCu610',USERNAME_DOMAIN='login.imperiodoacai.com';const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let business,tab='Resumo',cache={};function timeLabel(value){return String(value||'').slice(0,5)}function hasAutoSchedule(b=business){return Boolean(b?.auto_open_time&&b?.auto_close_time&&b.auto_open_time!==b.auto_close_time)}function timeMinutes(value){let [hour=0,minute=0]=String(value||'').split(':').map(Number);return hour*60+minute}function fortalezaParts(options){let bits=new Intl.DateTimeFormat('en-US',{timeZone:'America/Fortaleza',...options}).formatToParts(new Date());return type=>bits.find(x=>x.type===type)?.value||''}function fortalezaMinutes(){let part=fortalezaParts({hour:'2-digit',minute:'2-digit',hourCycle:'h23'});return Number(part('hour'))*60+Number(part('minute'))}function fortalezaDate(){let part=fortalezaParts({year:'numeric',month:'2-digit',day:'2-digit'});return part('year')+'-'+part('month')+'-'+part('day')}function hasTodayOverride(b=business){return Boolean(b?.manual_override_date&&typeof b.manual_override_open==='boolean'&&String(b.manual_override_date)===fortalezaDate())}function storeIsOpen(b=business){if(hasTodayOverride(b))return b.manual_override_open;if(!hasAutoSchedule(b))return Boolean(b?.is_open);let now=fortalezaMinutes(),opens=timeMinutes(b.auto_open_time),closes=timeMinutes(b.auto_close_time);return opens<closes?now>=opens&&now<closes:now>=opens||now<closes}function scheduleDetail(b=business){return hasTodayOverride(b)?'Controle manual válido hoje':hasAutoSchedule(b)?'Automático: '+timeLabel(b.auto_open_time)+' às '+timeLabel(b.auto_close_time):'Controle manual'}function businessStatusText(b=business){return(storeIsOpen(b)?'Cardápio aberto':'Cardápio fechado')+' · '+scheduleDetail(b)}
window.hideModal=()=>$('modal').classList.add('hidden');function error(e){console.error(e);alert('Ocorreu um erro. Veja o console e confira as permissões/configuração.')}async function init(){let {data:{user}}=await sb.auth.getUser();if(!user)return;$('loginBox').classList.add('hidden');$('logout').classList.remove('hidden');let {data:membership,error:e}=await sb.from('store_admins').select('business_id').eq('user_id',user.id).single();if(e){$('loginError').textContent='Este usuário não está vinculado a uma loja como administrador.';return}let r=await sb.from('businesses').select('*').eq('id',membership.business_id).single();if(r.error)return error(r.error);business=r.data;$('app').classList.remove('hidden');$('storeName').textContent=business.name;$('storeStatus').textContent=businessStatusText();renderTabs();loadTab()}function renderTabs(){let t=['Resumo','Produtos','Complementos','Localidades','Pagamento','Loja','Pedidos'];$('tabs').innerHTML=t.map(x=>`<button class="tab ${x===tab?'active':''}" onclick="window.changeTab('${x}')">${x}</button>`).join('')}window.changeTab=x=>{tab=x;renderTabs();loadTab()};
async function loadTab(){let v=$('view');$('saveStore').classList.toggle('hidden',tab!=='Loja');v.innerHTML='<p>Carregando…</p>';try{if(tab==='Resumo'){let {data:o,error:e}=await sb.from('orders').select('total,created_at').eq('business_id',business.id);if(e)throw e;let today=new Date().toDateString(),d=(o||[]).filter(x=>new Date(x.created_at).toDateString()===today),resetAt=business.revenue_reset_at?new Date(business.revenue_reset_at):null,revenue=resetAt?d.filter(x=>new Date(x.created_at)>=resetAt):d,resetText=resetAt?'Zerado às '+resetAt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Inclui os pedidos de hoje.';v.innerHTML=`<div class="grid"><article class="card">Pedidos recebidos <div class="metric">${o?.length||0}</div></article><article class="card">Pedidos hoje <div class="metric">${d.length}</div></article><article class="card">Faturamento hoje <div class="metric">${money(revenue.reduce((s,x)=>s+Number(x.total),0))}</div><small>${resetText}</small><br><button class="outline" style="margin-top:9px" onclick="window.resetRevenue()">Zerar faturamento</button></article><article class="card">Status <div class="metric">${business.is_open?'Aberto':'Fechado'}</div></article></div>`}else if(tab==='Produtos'){let [p,c]=await Promise.all([sb.from('products').select('*,categories(name)').eq('business_id',business.id).order('name'),sb.from('categories').select('*').eq('business_id',business.id).order('position')]);cache.categories=c.data||[];listProducts(p.data||[])}else if(tab==='Complementos')list(await get('complements'),'complemento');else if(tab==='Localidades')list(await get('localities'),'localidade');else if(tab==='Pagamento')payments(await get('payment_methods'));else if(tab==='Loja')storeForm();else orders(await get('orders'));}catch(e){error(e)}}async function get(table){let sort=table==='orders'?'created_at':table==='payment_methods'?'method':'name',query=sb.from(table).select('*').eq('business_id',business.id).order(sort,{ascending:table!=='orders'});let {data,error:e}=await query;if(e)throw e;return data}window.resetRevenue=async()=>{if(!confirm('Zerar apenas o faturamento exibido? Os pedidos continuarão salvos.'))return;let r=await sb.from('businesses').update({revenue_reset_at:new Date().toISOString()}).eq('id',business.id).select().single();if(r.error)return error(r.error);business=r.data;alert('Faturamento zerado. Os pedidos foram preservados.');loadTab()}
function listProducts(rows){$('view').innerHTML=`<div class="head"><h2>Produtos</h2><span><button class="outline" onclick="window.categoryForm()">Categorias</button> <button class="primary" onclick="window.productForm()">Adicionar produto</button></span></div>${rows.map(x=>`<div class="row"><span><b>${x.name}</b><small>${x.categories?.name||'Sem categoria'} · ${money(x.price)} · ${x.included_complements||0} complemento(s) incluso(s)${x.includes_coverage?' + cobertura':''} · ${x.active?'Ativo':'Inativo'}</small></span><span class="actions"><button class="outline" onclick="window.productForm('${x.id}')">Editar</button><button class="danger" onclick="window.remove('products','${x.id}')">Remover</button></span></div>`).join('')||'<p class="notice">Nenhum produto cadastrado.</p>'}`}
function list(rows,type){$('view').innerHTML=`<div class="head"><h2>${type==='complemento'?'Complementos':'Localidades'}</h2><button class="primary" onclick="window.simpleForm('${type}')">Adicionar</button></div>${rows.map(x=>`<div class="row"><span><b>${x.name}</b><small>${type==='complemento'?money(x.price)+' · '+(x.kind==='cobertura'?'Cobertura':'Complemento'):'Entrega: '+money(x.fee)} · ${x.active?'Ativo':'Inativo'}</small></span><span class="actions"><button class="outline" onclick="window.simpleForm('${type}','${x.id}')">Editar</button><button class="danger" onclick="window.remove('${type==='complemento'?'complements':'localities'}','${x.id}')">Remover</button></span></div>`).join('')||'<p class="notice">Nenhum item cadastrado.</p>'}`}
function payments(rows){$('view').innerHTML='<h2>Formas de pagamento</h2>'+['pix','cash','delivery'].map(m=>{let r=rows.find(x=>x.method===m);return `<div class="row"><b>${m==='pix'?'PIX':m==='cash'?'Dinheiro':'Pagamento na entrega'}</b><label><input type="checkbox" ${r?.active?'checked':''} onchange="window.setPayment('${m}',this.checked)"> Ativo</label></div>`}).join('')}
function legacyStoreForm(){$('view').innerHTML=`<h2>Dados da loja</h2><label class="field">Nome<input id="fName" value="${business.name}"></label><label class="field">Contato<input id="fContact" value="${business.contact||''}"></label><label class="field">WhatsApp com DDI e DDD<input id="fWhatsapp" value="${business.whatsapp}"></label><label class="field">Chave PIX<input id="fPix" value="${business.pix_key||''}"></label><label class="field">Informação de horário<input id="fHours" value="${business.opening_hours||''}" placeholder="Ex.: Entrega em 30 a 90 minutos"></label><h3>Programação automática</h3><label class="field">Abrir o cardápio às<input id="fAutoOpen" type="time" value="${timeLabel(business.auto_open_time)}"></label><label class="field">Fechar o cardápio às<input id="fAutoClose" type="time" value="${timeLabel(business.auto_close_time)}"></label><p class="notice">Com os dois horários preenchidos, o cardápio abre e fecha todos os dias automaticamente, no horário do Ceará. Para atendimento após a meia-noite, informe por exemplo 18:00 para abrir e 01:00 para fechar. Para voltar ao controle manual, apague os dois campos.</p><label><input id="fOpen" type="checkbox" ${business.is_open?'checked':''}> Cardápio aberto manualmente <small>(usado apenas sem programação automática)</small></label>`}
function orders(rows){$('view').innerHTML='<h2>Pedidos</h2>'+(rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(o=>`<div class="row"><span><b>${money(o.total)} — ${o.status}</b><small>${new Date(o.created_at).toLocaleString('pt-BR')} · ${o.customer_name||'Cliente'} · ${o.locality_name}</small></span><select onchange="window.setStatus('${o.id}',this.value)">${['novo','em_preparo','saiu_para_entrega','concluido','cancelado'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="notice">Ainda não há pedidos.</p>')}
window.productForm=async id=>{let row=id?(await sb.from('products').select('*').eq('id',id).single()).data:{name:'',description:'',price:'',image_url:'',category_id:'',included_complements:0,includes_coverage:false,active:true};$('modalTitle').textContent=id?'Editar produto':'Novo produto';$('modalBody').innerHTML=`<label class="field">Nome<input id="xName" value="${row.name||''}"></label><label class="field">Categoria<select id="xCategory"><option value="">Selecione</option>${cache.categories.map(c=>`<option value="${c.id}" ${c.id===row.category_id?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="field">Descrição<textarea id="xDescription">${row.description||''}</textarea></label><label class="field">Preço<input id="xPrice" type="number" min="0" step="0.01" value="${row.price||''}"></label><label class="field">Complementos incluídos<input id="xIncluded" type="number" min="0" step="1" value="${row.included_complements||0}"></label><label class="field">URL da imagem<input id="xImage" value="${row.image_url||''}"></label><label><input id="xCoverage" type="checkbox" ${row.includes_coverage?'checked':''}> Permite escolher cobertura</label><br><label><input id="xActive" type="checkbox" ${row.active?'checked':''}> Ativo</label><button class="primary" style="margin-top:12px" onclick="window.saveProduct('${id||''}')">Salvar</button>`;$('modal').classList.remove('hidden')};window.saveProduct=async id=>{let x={business_id:business.id,name:$('xName').value.trim(),category_id:$('xCategory').value||null,description:$('xDescription').value.trim()||null,price:+$('xPrice').value,image_url:$('xImage').value.trim()||null,included_complements:+$('xIncluded').value||0,includes_coverage:$('xCoverage').checked,active:$('xActive').checked};let r=id?await sb.from('products').update(x).eq('id',id):await sb.from('products').insert(x);if(r.error)return error(r.error);hideModal();loadTab()};window.simpleForm=async(type,id)=>{let table=type==='complemento'?'complement Tab()};window.remove=async(table,id)=>{if(!confirm('Remover este item?'))return;let r=await sb.from(table).delete().eq('id',id);if(r.error)return error(r.error);loadTab()};window.setPayment=async(method,active)=>{let {data:r}=await sb.from('payment_methods').select('id').eq('business_id',business.id).eq('method',method).maybeSingle(),q=r?sb.from('payment_methods').update({active}).eq('id',r.id):sb.from('payment_methods').insert({business_id:business.id,method,active}),out=await q;if(out.error)error(out.error)};window.setStatus=async(id,status)=>{let r=await sb.from('orders').update({status}).eq('id',id);if(r.error)error(r.error)};$('saveStore').onclick=async()=>{let x={name:$('fName').value.trim(),contact:$('fContact').value.trim()||null,whatsapp:$('fWhatsapp').value.trim(),pix_key:$('fPix').value.trim()||null,opening_hours:$('fHours').value.trim()||null,is_open:$('fOpen').checked},r=await sb.from('businesses').update(x).eq('id',business.id).select().single();if(r.error)return error(r.error);business=r.data;$('storeName').textContent=business.name;$('storeStatus').textContent=business.is_open?'Cardápio aberto':'Cardápio fechado';alert('Alterações salvas.')};function emailFromUsername(username){let value=username.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');return value?value+'@'+USERNAME_DOMAIN:null}$('login').onclick=async()=>{let email=emailFromUsername($('username').value);if(!email){$('loginError').textContent='Informe o nome de usuário.';return}let {error:e}=await sb.auth.signInWithPassword({email,password:$('password').value});if(e){$('loginError').textContent='Usuário ou senha incorretos.';return}init()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};init();
$('saveStore').onclick=async()=>{let autoOpen=$('fAutoOpen').value,autoClose=$('fAutoClose').value;if(Boolean(autoOpen)!==Boolean(autoClose))return alert('Informe os dois horários ou deixe os dois vazios para usar o controle manual.');if(autoOpen&&autoOpen===autoClose)return alert('Escolha horários diferentes para abrir e fechar o cardápio.');let x={name:$('fName').value.trim(),contact:$('fContact').value.trim()||null,whatsapp:$('fWhatsapp').value.trim(),pix_key:$('fPix').value.trim()||null,opening_hours:$('fHours').value.trim()||null,auto_open_time:autoOpen||null,auto_close_time:autoClose||null,is_open:$('fOpen').checked},r=await sb.from('businesses').update(x).eq('id',business.id).select().single();if(r.error)return error(r.error);business=r.data;$('storeName').textContent=business.name;$('storeStatus').textContent=businessStatusText();alert('Alterações salvas.')};setInterval(()=>{if(business)$('storeStatus').textContent=businessStatusText()},30000);function sizePricesText(prices){return Object.entries(prices||{}).map(([size,price])=>size+'='+price).join(', ')}function parseSizePrices(value){let prices={};String(value||'').split(',').forEach(piece=>{let [size,price]=piece.split('='),name=(size||'').trim().toUpperCase(),amount=Number(String(price||'').trim().replace(',','.'));if(name&&Number.isFinite(amount)&&amount>=0)prices[name]=amount});return prices}window.productForm=async id=>{let row=id?(await sb.from('products').select('*').eq('id',id).single()).data:{name:'',description:'',price:'',size_prices:{},image_url:'',category_id:'',included_complements:0,includes_coverage:false,active:true};$('modalTitle').textContent=id?'Editar produto':'Novo produto';$('modalBody').innerHTML=`<label class="field">Nome<input id="xName" value="${row.name||''}"></label><label class="field">Categoria<select id="xCategory"><option value="">Selecione</option>${cache.categories.map(c=>`<option value="${c.id}" ${c.id===row.category_id?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="field">Descrição<textarea id="xDescription">${row.description||''}</textarea></label><label class="field">Preço base<input id="xPrice" type="number" min="0" step="0.01" value="${row.price||''}"></label><label class="field">Tamanhos e valores (opcional)<input id="xSizes" placeholder="P=15, M=25, G=35" value="${sizePricesText(row.size_prices)}"></label><small>Para combinações especiais, preencha P, M e G. Deixe vazio nos demais produtos.</small><label class="field">Complementos incluídos<input id="xIncluded" type="number" min="0" step="1" value="${row.included_complements||0}"></label><label class="field">URL da imagem<input id="xImage" value="${row.image_url||''}"></label><label><input id="xCoverage" type="checkbox" ${row.includes_coverage?'checked':''}> Permite escolher cobertura</label><br><label><input id="xActive" type="checkbox" ${row.active?'checked':''}> Ativo</label><button class="primary" style="margin-top:12px" onclick="window.saveProduct('${id||''}')">Salvar</button>`;$('modal').classList.remove('hidden')};window.saveProduct=async id=>{let rawSizes=$('xSizes').value.trim(),sizePrices=parseSizePrices(rawSizes);if(rawSizes&&!Object.keys(sizePrices).length)return alert('Informe os tamanhos no formato P=15, M=25, G=35.');let x={business_id:business.id,name:$('xName').value.trim(),category_id:$('xCategory').value||null,description:$('xDescription').value.trim()||null,price:+$('xPrice').value,size_prices:sizePrices,image_url:$('xImage').value.trim()||null,included_complements:+$('xIncluded').value||0,includes_coverage:$('xCoverage').checked,active:$('xActive').checked};let r=id?await sb.from('products').update(x).eq('id',id):await sb.from('products').insert(x);if(r.error)return error(r.error);hideModal();loadTab()};
function iceCreamFlavorText(options){return Array.isArray(options?.ice_cream_flavors)?options.ice_cream_flavors.join(', '):''}function parseIceCreamFlavors(value){return [...new Set(String(value||'').split(',').map(x=>x.trim()).filter(Boolean))]}window.categoryForm=async()=>{let rows=cache.categories;$('modalTitle').textContent='Categorias';$('modalBody').innerHTML=rows.map(c=>{let iceCream=Boolean(c.order_options?.allow_base_choice);return `<section class="row" style="display:block"><label class="field">Nome da categoria<input id="categoryName_${c.id}" value="${c.name}"></label>${iceCream?`<label class="field">Sabores de sorvete<input id="iceCreamFlavors_${c.id}" value="${iceCreamFlavorText(c.order_options)}" placeholder="Bom Bom, Flocos, Brigadeiro"></label><small>Estas opções aparecem em todas as porções desta categoria quando o cliente escolhe Sorvete.</small>`:''}<div class="actions" style="margin-top:10px"><button class="primary" onclick="window.saveCategory('${c.id}')">Salvar</button><button class="danger" onclick="window.remove('categories','${c.id}');hideModal()">Remover</button></div></section>`}).join('')+`<label class="field">Nova categoria<input id="newCategory"></label><button class="primary" onclick="window.addCategory()">Adicionar</button>`;$('modal').classList.remove('hidden')};window.saveCategory=async id=>{let category=cache.categories.find(x=>x.id===id),name=$('categoryName_'+id).value.trim();if(!name)return alert('Informe o nome da categoria.');let options=category.order_options||{};if(options.allow_base_choice){let flavors=parseIceCreamFlavors($('iceCreamFlavors_'+id).value);if(!flavors.length)return alert('Informe ao menos um sabor de sorvete.');options={...options,allow_base_choice:true,ice_cream_flavors:flavors}}let r=await sb.from('categories').update({name,order_options:options}).eq('id',id);if(r.error)return error(r.error);hideModal();loadTab()};function storeForm(){$('view').innerHTML=`<h2>Dados da loja</h2><label class="field">Nome<input id="fName" value="${business.name}"></label><label class="field">Contato<input id="fContact" value="${business.contact||''}"></label><label class="field">WhatsApp com DDI e DDD<input id="fWhatsapp" value="${business.whatsapp}"></label><label class="field">Chave PIX<input id="fPix" value="${business.pix_key||''}"></label><label class="field">Informação de horário<input id="fHours" value="${business.opening_hours||''}" placeholder="Ex.: Entrega em 30 a 90 minutos"></label><h3>Controle de hoje</h3><p class="notice">${hasTodayOverride()?business.manual_override_open?'O cardápio está ligado manualmente até o fim de hoje.':'O cardápio está desligado manualmente até o fim de hoje.':'Nenhum comando manual ativo hoje.'} Estes botões funcionam mesmo com o horário automático e a programação volta a valer amanhã.</p><div class="actions" style="justify-content:flex-start"><button class="primary" onclick="window.setTodayOverride(true)">Ligar agora</button><button class="danger" onclick="window.setTodayOverride(false)">Desligar agora</button></div><h3>Programação automática</h3><label class="field">Abrir o cardápio às<input id="fAutoOpen" type="time" value="${timeLabel(business.auto_open_time)}"></label><label class="field">Fechar o cardápio às<input id="fAutoClose" type="time" value="${timeLabel(business.auto_close_time)}"></label><p class="notice">Com os dois horários preenchidos, o cardápio abre e fecha todos os dias automaticamente, no horário do Ceará. O controle de hoje acima só vale até a meia-noite. Para usar apenas o controle manual permanente, apague os dois horários.</p><label><input id="fOpen" type="checkbox" ${business.is_open?'checked':''}> Cardápio aberto manualmente <small>(usado apenas sem programação automática)</small></label>`}window.setTodayOverride=async open=>{let action=open?'ligar':'desligar';if(!confirm('Deseja '+action+' o cardápio manualmente até o fim de hoje? Amanhã a programação automática volta a funcionar.'))return;let r=await sb.from('businesses').update({manual_override_date:fortalezaDate(),manual_override_open:open}).eq('id',business.id).select().single();if(r.error)return error(r.error);business=r.data;$('storeStatus').textContent=businessStatusText();alert(open?'Cardápio ligado até o fim de hoje.':'Cardápio desligado até o fim de hoje.');storeForm()};
const agendaDays=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'],escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));window.toggleAgendaHours=(prefix,index,enabled)=>{for(let suffix of ['open','close']){let input=$(prefix+'_'+index+'_'+suffix);if(input)input.disabled=!enabled}};window.loadAgenda=async()=>{let view=$('view');$('saveStore').classList.remove('hidden');view.innerHTML='<p>Carregando agenda…</p>';let [weekly,exceptions]=await Promise.all([sb.from('business_weekly_hours').select('*').eq('business_id',business.id).order('weekday'),sb.from('business_schedule_exceptions').select('*').eq('business_id',business.id).order('exception_date')]);if(weekly.error||exceptions.error){console.error(weekly.error||exceptions.error);view.innerHTML='<p class="error">Não foi possível carregar a agenda. Execute primeiro a migração da agenda no Supabase.</p>';return}let weekMap=new Map((weekly.data||[]).map(row=>[Number(row.weekday),row])),rows=agendaDays.map((name,weekday)=>{let row=weekMap.get(weekday)||{is_open:false,opens_at:'',closes_at:''},open=Boolean(row.is_open);return `<div class="row"><span><b>${name}</b><small>${open?'Aberto':'Fechado'}</small></span><span class="actions"><label><input id="week_${weekday}_enabled" type="checkbox" ${open?'checked':''} onchange="window.toggleAgendaHours('week',${weekday},this.checked)"> Aberto</label><input id="week_${weekday}_open" type="time" value="${timeLabel(row.opens_at)}" ${open?'':'disabled'}><input id="week_${weekday}_close" type="time" value="${timeLabel(row.closes_at)}" ${open?'':'disabled'}></span></div>`}).join(''),exceptionRows=(exceptions.data||[]).map(row=>`<div class="row"><span><b>${String(row.exception_date).split('-').reverse().join('/')}</b><small>${row.is_open?'Aberto das '+timeLabel(row.opens_at)+' às '+timeLabel(row.closes_at):'Fechado'}</small></span><button class="danger" onclick="window.removeScheduleException('${row.id}')">Remover</button></div>`).join('')||'<p class="notice">Nenhuma exceção cadastrada.</p>';view.innerHTML=`<h2>Loja e agenda</h2><label class="field">Nome<input id="fName" value="${escapeHtml(business.name)}"></label><label class="field">Contato<input id="fContact" value="${escapeHtml(business.contact||'')}"></label><label class="field">WhatsApp com DDI e DDD<input id="fWhatsapp" value="${escapeHtml(business.whatsapp)}"></label><label class="field">Chave PIX<input id="fPix" value="${escapeHtml(business.pix_key||'')}"></label><label class="field">Informação de horário<input id="fHours" value="${escapeHtml(business.opening_hours||'')}" placeholder="Ex.: Entrega em 30 a 90 minutos"></label><input id="fAutoOpen" type="hidden" value="${timeLabel(business.auto_open_time)}"><input id="fAutoClose" type="hidden" value="${timeLabel(business.auto_close_time)}"><input id="fOpen" type="hidden" ${business.is_open?'checked':''}><h3>Fechar agora</h3><label class="row"><span><b>Forçar cardápio fechado</b><small>Tem prioridade sobre toda a agenda e só reabre quando este interruptor for desligado.</small></span><input type="checkbox" ${business.manual_force_closed?'checked':''} onchange="window.setManualForceClosed(this.checked)"></label><h3>Regra semanal</h3><p class="notice">Horários são do Ceará. Se fechar depois da meia-noite, informe por exemplo 18:00 até 02:00.</p>${rows}<button class="primary" style="margin-top:12px" onclick="window.saveWeeklySchedule()">Salvar agenda semanal</button><h3>Exceções por data</h3><p class="notice">Exceções vencem a regra semanal. Use para feriados, folgas ou aberturas extras.</p>${exceptionRows}<div class="card" style="margin-top:12px"><label class="field">Data<input id="exceptionDate" type="date"></label><label class="field">Status<select id="exceptionOpen" onchange="window.toggleAgendaHours('exception','new',this.value==='open')"><option value="closed">Fechado</option><option value="open">Aberto</option></select></label><div class="grid"><label class="field">Abre às<input id="exception_new_open" type="time" disabled></label><label class="field">Fecha às<input id="exception_new_close" type="time" disabled></label></div><button class="primary" onclick="window.saveScheduleException()">Adicionar exceção</button></div>`};window.setManualForceClosed=async closed=>{let result=await sb.from('businesses').update({manual_force_closed:closed}).eq('id',business.id).select().single();if(result.error)return error(result.error);business=result.data;$('storeStatus').textContent=closed?'Cardápio fechado manualmente':'Agenda de funcionamento ativa';alert(closed?'Cardápio fechado até você desligar este interruptor.':'Fechamento manual desativado. A agenda voltou a valer.');window.loadAgenda()};window.saveWeeklySchedule=async()=>{let rows=[];for(let weekday=0;weekday<7;weekday++){let isOpen=$('week_'+weekday+'_enabled').checked,opensAt=$('week_'+weekday+'_open').value,closesAt=$('week_'+weekday+'_close').value;if(isOpen&&(!opensAt||!closesAt||opensAt===closesAt))return alert('Informe horários diferentes para '+agendaDays[weekday]+'.');rows.push({business_id:business.id,weekday,is_open:isOpen,opens_at:isOpen?opensAt:null,closes_at:isOpen?closesAt:null})}let result=await sb.from('business_weekly_hours').upsert(rows,{onConflict:'business_id,weekday'});if(result.error)return error(result.error);alert('Agenda semanal salva.');window.loadAgenda()};window.saveScheduleException=async()=>{let date=$('exceptionDate').value,isOpen=$('exceptionOpen').value==='open',opensAt=$('exception_new_open').value,closesAt=$('exception_new_close').value;if(!date)return alert('Escolha a data da exceção.');if(isOpen&&(!opensAt||!closesAt||opensAt===closesAt))return alert('Informe horários diferentes para esta abertura.');let result=await sb.from('business_schedule_exceptions').upsert({business_id:business.id,exception_date:date,is_open:isOpen,opens_at:isOpen?opensAt:null,closes_at:isOpen?closesAt:null},{onConflict:'business_id,exception_date'});if(result.error)return error(result.error);alert('Exceção salva.');window.loadAgenda()};window.removeScheduleException=async id=>{if(!confirm('Remover esta exceção e voltar à regra semanal?'))return;let result=await sb.from('business_schedule_exceptions').delete().eq('id',id).eq('business_id',business.id);if(result.error)return error(result.error);window.loadAgenda()};const legacyChangeTab=window.changeTab;window.changeTab=nextTab=>{if(nextTab!=='Loja')return legacyChangeTab(nextTab);tab='Loja';renderTabs();window.loadAgenda()};
async function refreshAgendaStatus(){if(!business)return;let {data,error:e}=await sb.rpc('get_store_status',{p_slug:business.slug});let status=Array.isArray(data)?data[0]:data;if(!e&&status)$('storeStatus').textContent=(status.aberto?'Cardápio aberto':'Cardápio fechado')+' · '+status.mensagem}const renderAgenda=window.loadAgenda;window.loadAgenda=async()=>{await renderAgenda();refreshAgendaStatus()};setInterval(refreshAgendaStatus,30000);
let ordersPollingTimer,knownOrderIds=new Set();const orderStatuses={novo:'Novo',em_preparo:'Em preparo',saiu_para_entrega:'Saiu para entrega',entregue:'Entregue',cancelado:'Cancelado'},adminFortalezaDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Fortaleza',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function orderRange(date){let start=new Date(date+'T00:00:00-03:00'),end=new Date(start.getTime()+86400000);return [start.toISOString(),end.toISOString()]}window.loadOrdersAdmin=async polling=>{let selectedDate=$('ordersDate')?.value||adminFortalezaDate(),selectedStatus=$('ordersStatus')?.value||'todos',[from,to]=orderRange(selectedDate),query=sb.from('orders').select('id,created_at,customer_name,customer_phone,locality_name,address_note,payment_method,total,status,order_note').eq('business_id',business.id).gte('created_at',from).lt('created_at',to).order('created_at',{ascending:false});if(selectedStatus!=='todos')query=query.eq('status',selectedStatus);let {data:rows,error:e}=await query;if(e)return error(e);let ids=new Set((rows||[]).map(row=>row.id)),hasNew=polling&&[...ids].some(id=>!knownOrderIds.has(id));if(!polling)knownOrderIds=ids;else knownOrderIds=new Set([...knownOrderIds,...ids]);let view=$('view');if(!polling)view.innerHTML=`<div class="head"><h2>Pedidos</h2><span id="newOrdersFlag"></span></div><div class="grid"><label class="field">Data<input id="ordersDate" type="date" value="${selectedDate}" onchange="window.loadOrdersAdmin()"></label><label class="field">Status<select id="ordersStatus" onchange="window.loadOrdersAdmin()"><option value="todos">Todos</option>${Object.entries(orderStatuses).map(([value,label])=>`<option value="${value}" ${value===selectedStatus?'selected':''}>${label}</option>`).join('')}</select></label></div><section id="ordersList"></section>`;let list=$('ordersList');list.innerHTML=(rows||[]).map(row=>`<article class="row ${hasNew&&!knownOrderIds.has(row.id)?'notice':''}"><span><b>${escapeHtml(orderStatuses[row.status]||row.status)} · ${money(row.total)}</b><small>${new Date(row.created_at).toLocaleString('pt-BR')} · ${escapeHtml(row.customer_name||'Cliente')} · ${escapeHtml(row.locality_name)}</small></span><span class="actions"><button class="outline" onclick="window.showOrderDetail('${row.id}')">Detalhes</button><select onchange="window.updateOrderStatus('${row.id}',this.value)">${Object.entries(orderStatuses).map(([value,label])=>`<option value="${value}" ${value===row.status?'selected':''}>${label}</option>`).join('')}</select></span></article>`).join('')||'<p class="notice">Nenhum pedido encontrado para este filtro.</p>';if(hasNew){$('newOrdersFlag').innerHTML='<span class="badge">Novo pedido</span>';setTimeout(()=>{$('newOrdersFlag').innerHTML=''},6000)}clearInterval(ordersPollingTimer);ordersPollingTimer=setInterval(()=>{if(tab==='Pedidos')window.loadOrdersAdmin(true)},15000)};window.showOrderDetail=async id=>{let [order,items]=await Promise.all([sb.from('orders').select('*').eq('id',id).eq('business_id',business.id).single(),sb.from('order_items').select('*').eq('order_id',id)]);if(order.error||items.error)return error(order.error||items.error);let row=order.data,itemHtml=(items.data||[]).map(item=>`<div class="row"><span><b>${escapeHtml(item.product_name)} · ${item.quantity}x</b><small>${Array.isArray(item.complements)?item.complements.map(value=>escapeHtml(value.name)+(Number(value.price)?' ('+money(value.price)+')':'')).join(' · '):''}</small></span><b>${money(Number(item.unit_price)*item.quantity)}</b></div>`).join('');$('modalTitle').textContent='Pedido '+String(row.id).slice(0,8);$('modalBody').innerHTML=`<p><b>${escapeHtml(orderStatuses[row.status]||row.status)}</b> · ${new Date(row.created_at).toLocaleString('pt-BR')}</p><p><b>Cliente:</b> ${escapeHtml(row.customer_name||'Não informado')}<br><b>Telefone:</b> ${escapeHtml(row.customer_phone||'Não informado')}<br><b>Entrega:</b> ${escapeHtml(row.locality_name)} — ${escapeHtml(row.address_note)}<br><b>Pagamento:</b> ${escapeHtml(row.payment_method)}<br><b>Observação:</b> ${escapeHtml(row.order_note||'Nenhuma')}</p><h3>Itens</h3>${itemHtml}<div class="summary"><p><b>Total</b><b>${money(row.total)}</b></p></div>`;$('modal').classList.remove('hidden')};window.updateOrderStatus=async(id,status)=>{if(!Object.hasOwn(orderStatuses,status))return;let result=await sb.from('orders').update({status}).eq('id',id).eq('business_id',business.id);if(result.error)return error(result.error);window.loadOrdersAdmin(true)};const changeTabAfterAgenda=window.changeTab;window.changeTab=nextTab=>{if(nextTab!=='Pedidos')return changeTabAfterAgenda(nextTab);tab='Pedidos';renderTabs();window.loadOrdersAdmin()};
</script>
