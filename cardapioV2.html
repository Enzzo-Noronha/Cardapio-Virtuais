<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio FV</title>
<style>
:root{
    --bg: #15110b;
    --card: #ece1c7;
    --card-border: #c9a227;
    --gold: #c9a227;
    --gold-dark: #a9821c;
    --text: #241f18;
    --text-muted: #6b5f4a;
    --branco: #ffffff;
    --danger: #b23b2e;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
body{ background: var(--bg); }

header{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; color: var(--gold); background: var(--bg);
    border-bottom: 1px solid #2a2318;
}
header h3{ color: var(--gold); letter-spacing: 1px; }
.header-info{ display:flex; align-items:center; gap:10px; }
.horario{
    background: var(--gold); color: var(--text);
    padding:5px 8px; border-radius:5px; font-size:12px; font-weight:700;
}
.btn-carrinho{
    background: var(--gold); color: var(--text); border:none; border-radius:5px;
    padding:6px 12px; font-size:14px; font-weight:700; cursor:pointer;
}
#carrinhoCount{
    background: var(--text); color: var(--gold); border-radius:50%;
    padding:1px 6px; margin-left:6px; font-size:11px;
}

nav{
    display:flex; gap:6px; overflow-x:auto; padding:10px 12px; background: var(--bg);
    border-bottom: 1px solid #2a2318; scrollbar-width:none;
}
nav::-webkit-scrollbar{ display:none; }
.tab{
    background:none; border:1px solid var(--gold-dark); color: var(--gold);
    font-size:13px; font-weight:600; padding:7px 12px; border-radius:20px;
    cursor:pointer; white-space:nowrap;
}
.tab[aria-selected="true"]{ background: var(--gold); color: var(--text); }

main{ padding: 12px 10px 30px; }

.cardapio-secao{ display:none; }
.cardapio-secao.ativa{ display:block; }

.subsecao-titulo{
    color: var(--gold); text-transform:uppercase; letter-spacing:2px;
    font-weight:700; font-size:12.5px; margin: 22px 8px 10px;
}
.subsecao-titulo:first-child{ margin-top:6px; }

.item{
    background: var(--card); border:1px solid var(--card-border); border-radius:6px;
    margin:8px; padding:12px;
}
.item-header{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.item-header h4{ color: var(--text); font-size:15px; }
.tag-pizza{
    font-size:10px; background: var(--gold); color: var(--text);
    padding:2px 7px; border-radius:3px; font-weight:700; letter-spacing:.5px;
}
.item p{ color: var(--text-muted); font-size:13px; margin-top:5px; line-height:1.4; }

.variantes{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.var-btn{
    background: var(--gold); color: var(--text); border:none; border-radius:5px;
    padding:6px 10px; font-size:12.5px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:5px;
}
.var-btn:active{ opacity:.8; }
.var-rotulo{ opacity:.7; font-weight:600; }

footer.rodape-delivery{
    background: var(--gold); color: var(--text); text-align:center;
    padding:14px 10px; margin: 20px 8px 10px; border-radius:8px;
}
footer.rodape-delivery .titulo{ font-weight:700; margin-bottom:8px; }
footer.rodape-delivery .contato{
    display:inline-flex; align-items:center; gap:6px; background: var(--branco);
    padding:7px 14px; border-radius:20px; font-weight:700; font-size:14px;
}

/* ========================= PAINÉIS (CARRINHO / FINALIZAÇÃO) ========================= */

.painel{
    position:fixed; left:0; right:0; bottom:0; max-height:85vh;
    background: var(--card); border-top:2px solid var(--gold);
    border-radius:16px 16px 0 0; padding:15px; display:flex; flex-direction:column;
    color: var(--text); transform:translateY(100%); transition: transform .3s ease;
    z-index:100; overflow-y:auto;
}
.painel.aberto{ transform:translateY(0); }
.painel-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.painel-header h3{ color: var(--text); }
.fechar{ background:none; border:none; color: var(--text); font-size:22px; line-height:1; cursor:pointer; }

.carrinho-itens{ overflow-y:auto; margin-bottom:10px; }
.carrinho-vazio{ color: var(--text-muted); text-align:center; padding:20px 0; }
.carrinho-item{ border-bottom:1px solid #d8c79a; padding:10px 0; }
.carrinho-item-topo{ display:flex; justify-content:space-between; align-items:center; }
.carrinho-item-nome{ font-weight:600; }
.remover{ background:none; border:none; color: var(--danger); font-size:12px; cursor:pointer; }
.carrinho-item-controles{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.qtd-controle{ display:flex; align-items:center; gap:10px; }
.qtd-btn{
    background: var(--gold); color: var(--text); border:none; width:24px; height:24px;
    border-radius:4px; font-weight:700; cursor:pointer;
}
.carrinho-item-valor{ color: var(--gold-dark); font-weight:700; }
.obs-input{
    width:100%; margin-top:8px; padding:6px; border-radius:5px; border:1px solid #c9b98c;
    background: var(--branco); color: var(--text); font-size:13px;
}

.carrinho-cupom{ display:flex; gap:8px; margin-bottom:6px; }
.carrinho-cupom input{
    flex:1; padding:6px; border-radius:5px; border:1px solid #c9b98c;
    background: var(--branco); color: var(--text);
}
.carrinho-cupom button{
    background: var(--gold); border:none; border-radius:5px; padding:0 12px;
    font-weight:700; cursor:pointer; color: var(--text);
}
#cupomMsg{ font-size:12px; margin-bottom:10px; min-height:14px; }

.resumo{ border-top:1px solid #c9b98c; padding-top:10px; margin-bottom:10px; }
.linha-resumo{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; color: var(--text-muted); }
.linha-resumo.total{ color: var(--text); font-weight:700; font-size:16px; margin-top:4px; }

.btn-primario{
    background: var(--gold); color: var(--text); border:none; border-radius:5px;
    padding:12px; font-weight:700; font-size:15px; cursor:pointer;
}
.btn-primario:disabled{ opacity:.5; cursor:not-allowed; }

.form-finalizacao label{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; font-size:13px; color: var(--text-muted); }
.form-finalizacao input[type="text"], .form-finalizacao textarea{
    padding:8px; border-radius:5px; border:1px solid #c9b98c; background: var(--branco);
    color: var(--text); font-size:14px; font-family:inherit;
}
.form-finalizacao textarea{ min-height:60px; resize:vertical; }

.grupo-radio{ margin-bottom:12px; font-size:13px; }
.grupo-radio > span{ display:block; margin-bottom:6px; color: var(--text-muted); }
.grupo-radio label{ display:inline-flex; align-items:center; gap:4px; margin-right:14px; font-weight:400; color: var(--text); }
</style>
</head>
<body>

<header>
    <h3>Cardápio FV</h3>
    <div class="header-info">
        <span class="horario">Delivery</span>
        <button id="btnCarrinho" class="btn-carrinho">Carrinho<span id="carrinhoCount">0</span></button>
    </div>
</header>

<nav>
    <button class="tab" data-target="pizzas" aria-selected="true">Pizzas</button>
    <button class="tab" data-target="calzones" aria-selected="false">Calzones</button>
    <button class="tab" data-target="esfirras" aria-selected="false">Esfirras</button>
    <button class="tab" data-target="lanches" aria-selected="false">Lanches</button>
    <button class="tab" data-target="pratos" aria-selected="false">Pratos da Casa</button>
    <button class="tab" data-target="bebidas" aria-selected="false">Bebidas</button>
</nav>

<main>
    <section id="pizzas" class="cardapio-secao ativa"></section>
    <section id="calzones" class="cardapio-secao"></section>
    <section id="esfirras" class="cardapio-secao"></section>
    <section id="lanches" class="cardapio-secao"></section>
    <section id="pratos" class="cardapio-secao"></section>
    <section id="bebidas" class="cardapio-secao"></section>

    <footer class="rodape-delivery">
        <div class="titulo">AQUI TEM DELIVERY!</div>
        <div class="contato">📞 VANESSA 88 9 9655-1900</div>
    </footer>
</main>

<!-- ========================= CARRINHO ========================= -->
<div id="carrinhoPanel" class="painel">
    <div class="painel-header">
        <h3>Seu pedido</h3>
        <button id="fecharCarrinho" class="fechar" aria-label="Fechar carrinho">×</button>
    </div>
    <div id="carrinhoItens" class="carrinho-itens"></div>
    <div class="carrinho-cupom">
        <input type="text" id="inputCupom" placeholder="Cupom de desconto">
        <button id="btnCupom" type="button">Aplicar</button>
    </div>
    <div id="cupomMsg"></div>
    <div class="resumo">
        <div class="linha-resumo"><span>Subtotal</span><span id="subtotalValor">R$ 0,00</span></div>
        <div class="linha-resumo"><span>Taxa de entrega</span><span id="taxaValor">R$ 0,00</span></div>
        <div class="linha-resumo" id="linhaDesconto" style="display:none;"><span>Desconto</span><span id="descontoValor">- R$ 0,00</span></div>
        <div class="linha-resumo total"><span>Total</span><span id="totalValor">R$ 0,00</span></div>
    </div>
    <button id="btnFinalizar" class="btn-primario" type="button" disabled>Continuar</button>
</div>

<!-- ========================= FINALIZAÇÃO ========================= -->
<div id="finalizacaoPanel" class="painel">
    <div class="painel-header">
        <h3>Finalizar pedido</h3>
        <button id="fecharFinalizacao" class="fechar" aria-label="Fechar finalização">×</button>
    </div>
    <form id="formFinalizacao" class="form-finalizacao">
        <label>Nome<input type="text" id="campoNome" placeholder="Seu nome"></label>
        <div class="grupo-radio">
            <span>Tipo de pedido</span>
            <label><input type="radio" name="tipoPedido" value="entrega" checked> Entrega</label>
            <label><input type="radio" name="tipoPedido" value="retirada"> Retirada</label>
        </div>
        <label id="campoEnderecoWrap">Endereço<input type="text" id="campoEndereco" placeholder="Rua, número, bairro"></label>
        <div class="grupo-radio">
            <span>Forma de pagamento</span>
            <label><input type="radio" name="pagamento" value="dinheiro" checked> Dinheiro</label>
            <label><input type="radio" name="pagamento" value="cartao"> Cartão</label>
            <label><input type="radio" name="pagamento" value="pix"> Pix</label>
        </div>
        <label id="campoTrocoWrap">Troco para quanto? (opcional)<input type="text" id="campoTroco" placeholder="Ex: R$ 50,00"></label>
        <label>Observação geral<textarea id="campoObsGeral" placeholder="Ex: campainha não funciona..."></textarea></label>
        <div class="resumo">
            <div class="linha-resumo total"><span>Total</span><span id="totalFinalValor">R$ 0,00</span></div>
        </div>
        <button type="submit" class="btn-primario">Enviar pedido no WhatsApp</button>
    </form>
</div>

   DADOS DO CARDÁPIO
   Cada item: { nome, desc, tag (opcional), variantes: [[rotulo, valor], ...] }

   ========================================================================= */

function pz(nome, desc, tag, p, m, g, gg){
    return { nome: nome, desc: desc, tag: tag, variantes: [["P", p], ["M", m], ["G", g], ["GG", gg]] };
}
function un(nome, desc, valor){
    return { nome: nome, desc: desc, variantes: [["", valor]] };
}
function ps(nome, desc, v300, v500){
    return { nome: nome, desc: desc, variantes: [["300g", v300], ["500g", v500]] };
}
function jr(nome, desc, copo, jp, jg){
    return { nome: nome, desc: desc, variantes: [["Copo", copo], ["Jarra P", jp], ["Jarra G", jg]] };
}
function dl(nome, desc, dose, litro){
    return { nome: nome, desc: desc, variantes: [["Dose", dose], ["Litro", litro]] };
}

/* ========================= RENDERIZAÇÃO ========================= */

function formatarMoeda(valor){
    return valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function renderItem(item){
    let tagHtml = item.tag ? '<span class="tag-pizza">' + item.tag + '</span>' : '';
    let descHtml = item.desc ? '<p>' + item.desc + '</p>' : '';
    let variantesHtml = item.variantes.map(function(v){
        let rotulo = v[0], valor = v[1];
        let nomeCompleto = rotulo ? item.nome + " (" + rotulo + ")" : item.nome;
        let rotuloHtml = rotulo ? '<span class="var-rotulo">' + rotulo + '</span>' : 'Adicionar';
        return '<button class="var-btn" data-nome="' + nomeCompleto + '" data-valor="' + valor + '">' +
                    rotuloHtml + '<span>' + formatarMoeda(valor) + '</span>' +
               '</button>';
    }).join('');

    return '<div class="item">' +
                '<div class="item-header"><h4>' + item.nome + '</h4>' + tagHtml + '</div>' +
                descHtml +
                '<div class="variantes">' + variantesHtml + '</div>' +
           '</div>';
}

function renderSecao(containerId, subsecoes){
    let html = subsecoes.map(function(sub){
        return '<h3 class="subsecao-titulo">' + sub.titulo + '</h3>' + sub.itens.map(renderItem).join('');
    }).join('');
    document.getElementById(containerId).innerHTML = html;
}

renderSecao("pizzas", PIZZAS);
renderSecao("calzones", CALZONES);
renderSecao("esfirras", ESFIRRAS);
renderSecao("lanches", LANCHES);
renderSecao("pratos", PRATOS);
renderSecao("bebidas", BEBIDAS);

/* ========================= NAVEGAÇÃO ENTRE ABAS ========================= */

let tabs = document.querySelectorAll(".tab");
let secoes = document.querySelectorAll(".cardapio-secao");

tabs.forEach(function(tab){
    tab.addEventListener("click", function(){
        tabs.forEach(function(t){ t.setAttribute("aria-selected", "false"); });
        tab.setAttribute("aria-selected", "true");
        secoes.forEach(function(s){ s.classList.remove("ativa"); });
        document.getElementById(tab.dataset.target).classList.add("ativa");
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
});

/* ========================= CARRINHO ========================= */

const TAXA_ENTREGA = 5.00;
const WHATSAPP_NUMERO = "5588996551900"; // número do cardápio (Vanessa) — ajuste se necessário

let carrinho = [];
let cupomAplicado = null;

let btnCarrinho = document.getElementById("btnCarrinho");
let carrinhoCount = document.getElementById("carrinhoCount");
let carrinhoPanel = document.getElementById("carrinhoPanel");
let fecharCarrinho = document.getElementById("fecharCarrinho");
let carrinhoItens = document.getElementById("carrinhoItens");
let inputCupom = document.getElementById("inputCupom");
let btnCupom = document.getElementById("btnCupom");
let cupomMsg = document.getElementById("cupomMsg");
let subtotalValor = document.getElementById("subtotalValor");
let taxaValor = document.getElementById("taxaValor");
let linhaDesconto = document.getElementById("linhaDesconto");
let descontoValor = document.getElementById("descontoValor");
let totalValor = document.getElementById("totalValor");
let btnFinalizar = document.getElementById("btnFinalizar");

function adicionarAoCarrinho(nome, valor){
    let existente = carrinho.find(function(item){ return item.nome === nome; });
    if (existente){
        existente.quantidade++;
    } else {
        carrinho.push({ nome: nome, valor: valor, quantidade: 1, observacao: "" });
    }
    renderCarrinho();
    carrinhoPanel.classList.add("aberto");
    finalizacaoPanel.classList.remove("aberto");
}

function alterarQuantidade(index, delta){
    carrinho[index].quantidade += delta;
    if (carrinho[index].quantidade <= 0) carrinho.splice(index, 1);
    renderCarrinho();
}

function removerItem(index){
    carrinho.splice(index, 1);
    renderCarrinho();
}

function atualizarObservacao(index, texto){
    carrinho[index].observacao = texto;
}

function aplicarCupom(){
    let codigo = inputCupom.value.trim().toUpperCase();
    if (codigo === "FVPIZZA10"){
        cupomAplicado = { codigo: codigo, percentual: 0.10 };
        cupomMsg.textContent = "Cupom FVPIZZA10 aplicado: 10% de desconto.";
        cupomMsg.style.color = "var(--gold-dark)";
    } else {
        cupomAplicado = null;
        cupomMsg.textContent = codigo ? "Cupom inválido." : "";
        cupomMsg.style.color = "#b23b2e";
    }
    atualizarResumo();
}

function calcularSubtotal(){
    return carrinho.reduce(function(t, i){ return t + i.valor * i.quantidade; }, 0);
}

function tipoPedidoSelecionado(){
    let r = document.querySelector('input[name="tipoPedido"]:checked');
    return r ? r.value : "entrega";
}

function atualizarResumo(){
    let subtotal = calcularSubtotal();
    let temItens = carrinho.length > 0;
    let taxa = temItens && tipoPedidoSelecionado() === "entrega" ? TAXA_ENTREGA : 0;
    let desconto = cupomAplicado ? subtotal * cupomAplicado.percentual : 0;
    let total = subtotal + taxa - desconto;

    subtotalValor.textContent = formatarMoeda(subtotal);
    taxaValor.textContent = formatarMoeda(taxa);
    if (desconto > 0){
        linhaDesconto.style.display = "flex";
        descontoValor.textContent = "- " + formatarMoeda(desconto);
    } else {
        linhaDesconto.style.display = "none";
    }
    totalValor.textContent = formatarMoeda(total);
    totalFinalValor.textContent = formatarMoeda(total);

    let qtdTotal = carrinho.reduce(function(t, i){ return t + i.quantidade; }, 0);
    carrinhoCount.textContent = qtdTotal;
    btnFinalizar.disabled = !temItens;
}

function renderCarrinho(){
    carrinhoItens.innerHTML = "";
    if (carrinho.length === 0){
        carrinhoItens.innerHTML = '<p class="carrinho-vazio">Seu carrinho está vazio.</p>';
        atualizarResumo();
        return;
    }
    carrinho.forEach(function(item, index){
        let div = document.createElement("div");
        div.className = "carrinho-item";
        div.innerHTML =
            '<div class="carrinho-item-topo">' +
                '<span class="carrinho-item-nome">' + item.nome + '</span>' +
                '<button class="remover" type="button" data-index="' + index + '">Remover</button>' +
            '</div>' +
            '<div class="carrinho-item-controles">' +
                '<div class="qtd-controle">' +
                    '<button class="qtd-btn menos" type="button" data-index="' + index + '">-</button>' +
                    '<span>' + item.quantidade + '</span>' +
                    '<button class="qtd-btn mais" type="button" data-index="' + index + '">+</button>' +
                '</div>' +
                '<span class="carrinho-item-valor">' + formatarMoeda(item.valor * item.quantidade) + '</span>' +
            '</div>' +
            '<input type="text" class="obs-input" data-index="' + index + '" placeholder="Observação" value="' + item.observacao + '">';
        carrinhoItens.appendChild(div);
    });
    atualizarResumo();
}

document.querySelector("main").addEventListener("click", function(evento){
    let botao = evento.target.closest(".var-btn");
    if (!botao) return;
    adicionarAoCarrinho(botao.dataset.nome, parseFloat(botao.dataset.valor));
});

btnCarrinho.addEventListener("click", function(){
    carrinhoPanel.classList.toggle("aberto");
    finalizacaoPanel.classList.remove("aberto");
});
fecharCarrinho.addEventListener("click", function(){ carrinhoPanel.classList.remove("aberto"); });
btnCupom.addEventListener("click", aplicarCupom);

carrinhoItens.addEventListener("click", function(evento){
    let botao = evento.target.closest("button");
    if (!botao) return;
    let index = parseInt(botao.dataset.index);
    if (botao.classList.contains("mais")) alterarQuantidade(index, 1);
    else if (botao.classList.contains("menos")) alterarQuantidade(index, -1);
    else if (botao.classList.contains("remover")) removerItem(index);
});

carrinhoItens.addEventListener("input", function(evento){
    if (evento.target.classList.contains("obs-input")){
        atualizarObservacao(parseInt(evento.target.dataset.index), evento.target.value);
    }
});

/* ========================= FINALIZAÇÃO ========================= */

let finalizacaoPanel = document.getElementById("finalizacaoPanel");
let fecharFinalizacao = document.getElementById("fecharFinalizacao");
let formFinalizacao = document.getElementById("formFinalizacao");
let campoNome = document.getElementById("campoNome");
let campoEnderecoWrap = document.getElementById("campoEnderecoWrap");
let campoEndereco = document.getElementById("campoEndereco");
let campoTrocoWrap = document.getElementById("campoTrocoWrap");
let campoTroco = document.getElementById("campoTroco");
let campoObsGeral = document.getElementById("campoObsGeral");
let totalFinalValor = document.getElementById("totalFinalValor");

btnFinalizar.addEventListener("click", function(){
    carrinhoPanel.classList.remove("aberto");
    finalizacaoPanel.classList.add("aberto");
    atualizarResumo();
});
fecharFinalizacao.addEventListener("click", function(){ finalizacaoPanel.classList.remove("aberto"); });

document.querySelectorAll('input[name="tipoPedido"]').forEach(function(r){
    r.addEventListener("change", function(){
        campoEnderecoWrap.style.display = r.value === "entrega" && r.checked ? "flex" : "none";
        atualizarResumo();
    });
});
document.querySelectorAll('input[name="pagamento"]').forEach(function(r){
    r.addEventListener("change", function(){
        campoTrocoWrap.style.display = r.value === "dinheiro" && r.checked ? "flex" : "none";
    });
});

function montarMensagem(){
    let subtotal = calcularSubtotal();
    let tipoPedido = tipoPedidoSelecionado();
    let taxa = tipoPedido === "entrega" ? TAXA_ENTREGA : 0;
    let desconto = cupomAplicado ? subtotal * cupomAplicado.percentual : 0;
    let total = subtotal + taxa - desconto;
    let pagamento = document.querySelector('input[name="pagamento"]:checked').value;
    let pagamentoTexto = { dinheiro: "Dinheiro", cartao: "Cartão", pix: "Pix" }[pagamento];

    let linhas = [];
    linhas.push("*Novo pedido - Cardápio FV*");
    linhas.push("");
    carrinho.forEach(function(item){
        let linha = item.quantidade + "x " + item.nome + " - " + formatarMoeda(item.valor * item.quantidade);
        if (item.observacao) linha += " (Obs: " + item.observacao + ")";
        linhas.push(linha);
    });
    linhas.push("");
    linhas.push("Subtotal: " + formatarMoeda(subtotal));
    if (tipoPedido === "entrega") linhas.push("Taxa de entrega: " + formatarMoeda(taxa));
    if (desconto > 0) linhas.push("Desconto (" + cupomAplicado.codigo + "): -" + formatarMoeda(desconto));
    linhas.push("*Total: " + formatarMoeda(total) + "*");
    linhas.push("");
    linhas.push("Nome: " + campoNome.value.trim());
    linhas.push("Tipo: " + (tipoPedido === "entrega" ? "Entrega" : "Retirada"));
    if (tipoPedido === "entrega") linhas.push("Endereço: " + campoEndereco.value.trim());
    linhas.push("Pagamento: " + pagamentoTexto);
    if (pagamento === "dinheiro" && campoTroco.value.trim()) linhas.push("Troco para: " + campoTroco.value.trim());
    if (campoObsGeral.value.trim()){
        linhas.push("");
        linhas.push("Obs: " + campoObsGeral.value.trim());
    }
    return linhas.join("\n");
}

formFinalizacao.addEventListener("submit", function(evento){
    evento.preventDefault();
    if (!campoNome.value.trim()){ alert("Informe seu nome para continuar."); return; }
    if (tipoPedidoSelecionado() === "entrega" && !campoEndereco.value.trim()){ alert("Informe o endereço de entrega."); return; }
    let mensagem = montarMensagem();
    let link = "https://wa.me/" + WHATSAPP_NUMERO + "?text=" + encodeURIComponent(mensagem);
    window.open(link, "_blank");
});

renderCarrinho();
</script>
